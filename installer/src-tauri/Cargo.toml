[package]
name = "maestro-setup"
version = "0.4.2"
description = "Maestro Setup: branded bootstrapper for the Maestro desktop release"
authors = ["Octomynd"]
edition = "2021"
rust-version = "1.77"

# The distributed file is literally `Maestro-Setup.exe`.
[[bin]]
name = "Maestro-Setup"
path = "src/main.rs"

[lib]
name = "maestro_setup_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
# rustls keeps the build free of OpenSSL on Windows.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
# A small, fast-starting installer matters more than build time.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
